# /etc/nginx/sites-available/juliana.multiplosmm.com.br
#
# Depois de criar o registro A do subdominio apontando para o VPS:
#   sudo ln -s /etc/nginx/sites-available/juliana.multiplosmm.com.br /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d juliana.multiplosmm.com.br
# O certbot cuida da renovacao automatica.

server {
    listen 80;
    listen [::]:80;
    server_name juliana.multiplosmm.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name juliana.multiplosmm.com.br;

    # Preenchido pelo certbot.
    # ssl_certificate     /etc/letsencrypt/live/juliana.multiplosmm.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/juliana.multiplosmm.com.br/privkey.pem;

    # A foto do cliente vai em base64 no corpo do /compose.
    client_max_body_size 12M;

    # A composicao de 2000 px leva alguns segundos em VPS modesto.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O bundle e servido com cache curto: a versao vai na query da tag do GTM.
    location = /widget.js {
        proxy_pass http://127.0.0.1:8787/widget.js;
        add_header Cache-Control "public, max-age=300";
    }
}
